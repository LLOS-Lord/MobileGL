name: MobileGL iOS dylib

on:
  push:
    branches:
      - dev
      - Feat/Backend-Direct-GLES
      - Feat/Backend-Direct-Vulkan
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      BUILD_DIR: build-ios
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ios-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ios-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ios-ccache-

      - name: Install build tools
        run: |
          brew install ccache ninja

      # === FIX: Tách step cũ thành 2 bước riêng biệt ===
      # MoltenVK KHÔNG được hỗ trợ bởi humbletim/setup-vulkan-sdk
      # (nằm trong TODO của CMakeLists.txt action)
      # => Cài Vulkan-Headers riêng, tải MoltenVK prebuilt riêng

      - name: Install Vulkan Headers
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers
          vulkan-use-cache: true

      - name: Download MoltenVK iOS prebuilt
        run: |
          MOLTENVK_VERSION="v1.2.11"
          wget -q "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}-artifacts/MoltenVK-ios.tar" -O MoltenVK-ios.tar
          mkdir -p /tmp/moltenvk-ios
          tar -xf MoltenVK-ios.tar -C /tmp/moltenvk-ios
          echo "MoltenVK iOS extracted successfully"
          echo "Available libMoltenVK.a files:"
          find /tmp/moltenvk-ios -name "libMoltenVK.a"

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Download iOS toolchain
        run: |
          curl -L -o ios.toolchain.cmake https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake

      - name: Configure CMake
        run: |
          # Tìm đường dẫn tới thư viện MoltenVK iOS trong package đã tải
          # MoltenVK-ios.tar có cấu trúc: Package/Latest/MoltenVK/static/iOS/libMoltenVK.a
          MVK_IOS_LIB=$(find /tmp/moltenvk-ios -name "libMoltenVK.a" | head -n 1)

          if [ -z "$MVK_IOS_LIB" ]; then
            echo "Error: libMoltenVK.a not found in MoltenVK iOS package!"
            echo "Available files:"
            find /tmp/moltenvk-ios -type f | head -30
            exit 1
          fi

          echo "Using MoltenVK iOS library: $MVK_IOS_LIB"
          echo "File exists: $(test -f "$MVK_IOS_LIB" && echo yes || echo no)"

          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMOBILEGL_IOS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF \
            -DMOBILEGL_BUILD_TRACE_REPLAY=OFF \
            -DMOBILEGL_LOG_ACTIVE_LEVEL=MOBILEGL_LOG_LEVEL_INFO \
            -DMOBILEGL_VULKAN_LIBRARY="$MVK_IOS_LIB"

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config Release --target MobileGL --parallel $(sysctl -n hw.ncpu)

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Package iOS dylib
        run: |
          mkdir -p ci-artifacts
          find "${BUILD_DIR}" -name "libMobileGL.dylib" -exec cp {} ci-artifacts/ \;
          cd ci-artifacts && zip -r ../mobilegl-ios-dylib.zip .

      - name: Upload iOS dylib
        uses: actions/upload-artifact@v4
        with:
          name: mobilegl-ios-dylib
          path: mobilegl-ios-dylib.zip
          if-no-files-found: error
